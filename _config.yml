# Welcome to Jekyll!
#
# Site configuration for Cub Scout Pack 147
# Grosse Pointe Park, Michigan

# Site settings
title: Pack 147
email: gppack147@gmail.com
cubmaster_email: gppack147@gmail.com

description: >-
  Cub Scout Pack 147 of Grosse Pointe Park, Michigan. We provide fun, character-building adventures
  for K-5th grade youth through outdoor activities, STEM projects, and community service.
  Join us for camping, Pinewood Derby races, and much more!

# Custom domain
url: "https://pack147gpp.org"
baseurl: ""

# Build settings
markdown: kramdown
theme: minima

plugins:
  - jekyll-feed
  #- jekyll-google-calendar
  - jekyll-tailwindcss

# Google Calendar configuration
gcalendar:
  key_file: ./gcalendar-key.json
  calendars:
    - name: 🐾 Pack 147
      id: c_dbd8c6d9e13e75097d2a4bb1e980c580cc9f07d2407f004db14eb0cfe5037bae@group.calendar.google.com
      directory: events
      layout: event-public
      date_format: "%Y-%m-%d"
      look_ahead: 365

# Exclude from processing
exclude:
  - gcalendar-key.json
  - CLAUDE.md
  - README.md
  - LICENSE
  - mise.toml
  - script/
  - docs/
  - .claude/
  - .github/
  - .ruby-lsp/
  - .ruby-version
  - .sass-cache/
  - .jekyll-cache/
